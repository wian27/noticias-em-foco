name: Atualizar notícias e publicar no Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * *"
      timezone: "America/Campo_Grande"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6
      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Buscar notícias nas fontes RSS
        run: |
          mkdir -p _site/data
          python3 scripts/fetch_news.py --output _site/data/news.json
          cp index.html article.html admin.html analytics-config.js _site/
          cp index.html _site/index.html
          touch _site/.nojekyll
      - name: Enviar os arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
